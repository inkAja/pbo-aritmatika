spring.application.name=aritmatika
# ===================================================================
# POSTGRESQL DATA SOURCE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/aritmatika
spring.datasource.username=postgres
spring.datasource.password=inkAja17

# The driver class is optional in modern Spring Boot versions (auto-detected), but good practice
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# Automatically sets the database dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DDL auto options: 'update' updates schema, 'create-drop' is good for testing. 
# Use 'none' or 'validate' for production.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (great for development)

# ===================================================================
# HIKARI CONNECTION POOL CONFIGURATION (Optional Tuning)
# ===================================================================
# Maximum number of actual connections to the database
spring.datasource.hikari.maximum-pool-size=10
# Minimum number of idle connections in the pool
spring.datasource.hikari.minimum-idle=5
# Maximum time (in ms) that a connection can sit idle
spring.datasource.hikari.idle-timeout=30000